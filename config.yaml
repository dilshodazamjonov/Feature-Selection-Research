dataset_name: homecredit
data_dir: data/homecredit/raw
description_path: data/homecredit/metadata/columns_description.csv
results_dir: results/homecredit
random_seed: 42
feature_budgets:
  lr: 20
  catboost: 40
n_splits: 5
dev_start_day: -600
oot_start_day: -240
oot_end_day: 0
cv_gap_groups: 1
excluded_feature_columns:
  - TARGET
  - recent_decision
  - PREV_recent_decision_MAX
  - DAYS_DECISION
  - application_time_proxy

llm:
  enabled: true
  shared_ranking_enabled: true
  ranking_budget:
    lr_candidate_pool: 60
    catboost_candidate_pool: 100
    max_shared_pool: 100
  prompt_version: stability_expert_v3
  model: gpt-4.1-mini
  max_features: 100
  cache_dir: artifacts/llm_cache
