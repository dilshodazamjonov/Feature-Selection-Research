experiment_version: clip_v2
statistical_view_version: compact_target_free_v2
statistical_input_dimension: 13
output_root: results/clip_v2
v1_reference_manifest: results/clip_versions/v1/freeze_manifest.json
train_dataset: homecredit
external_validation_dataset: lendingclub_v2
fit_scaler_on: homecredit_train_features_only
external_refit_allowed: false
descriptor_order:
  - missing_rate
  - unique_ratio
  - concentration_share
  - signed_log_mean
  - log_standard_deviation
  - clipped_skewness
  - normalized_entropy
  - is_numeric
  - is_categorical
  - is_binary
  - numeric_stats_valid
  - skewness_valid
  - entropy_valid
scaled_columns:
  - missing_rate
  - unique_ratio
  - concentration_share
  - signed_log_mean
  - log_standard_deviation
  - clipped_skewness
  - normalized_entropy
unscaled_columns:
  - is_numeric
  - is_categorical
  - is_binary
  - numeric_stats_valid
  - skewness_valid
  - entropy_valid
forbidden_inputs:
  - target
  - oot
  - psi
  - prediction
  - llm_rank
  - stable_core_membership
  - post_origination
output_dir: results/clip_v2/statistical_view
