experiment_version: clip_v2
statistical_view_version: compact_target_free_v2
statistical_input_dimension: 13
output_root: results/clip_v2
v1_reference_manifest: results/clip_versions/v1/freeze_manifest.json
tensor_schema_path: results/clip_v2/contrastive_data/contrastive_tensor_schema.json
contrastive_pair_manifest_path: results/clip_v2/contrastive_data/contrastive_pair_manifest.json
train_pairs_path: results/clip_v2/contrastive_data/homecredit_train_positive_pairs.parquet
validation_pairs_path: results/clip_v2/contrastive_data/homecredit_validation_positive_pairs.parquet
external_pairs_path: results/clip_v2/contrastive_data/lendingclub_v2_external_pairs.parquet
negative_exclusion_pairs_path: results/clip_v2/contrastive_data/negative_exclusion_pairs.parquet
negative_policy_manifest_path: results/clip_v2/contrastive_data/negative_policy_manifest.json
homecredit_text_embeddings_path: results/clip/text_baseline/homecredit_text_embeddings.parquet
lendingclub_v2_text_embeddings_path: results/clip/text_baseline/lendingclub_v2_text_embeddings.parquet
homecredit_statistical_vectors_path: results/clip_v2/statistical_view/homecredit_statistical_vectors.parquet
lendingclub_v2_statistical_vectors_path: results/clip_v2/statistical_view/lendingclub_v2_statistical_vectors.parquet
text_embedding_manifest_path: results/clip/text_baseline/embedding_cache_manifest.json
statistical_preprocessor_path: results/clip_v2/statistical_view/statistical_preprocessor.json
source_manifest_path: results/clip/dry_run/training_manifest.json
split_manifest_path: results/clip_v2/contrastive_data/split_manifest.json
output_dir: results/clip_v2/training
model:
  text_input_dim: 384
  statistical_input_dim: 13
  text_hidden_dim: 64
  statistical_hidden_dim: 16
  shared_embedding_dim: 32
  dropout: 0.05
  activation: gelu
optimizer: AdamW
learning_rate: 0.001
weight_decay: 0.01
batch_size: 64
max_epochs: 80
early_stopping_patience: 15
minimum_improvement: 0.0001
gradient_clipping_enabled: true
gradient_clip_norm: 1.0
selection_metric: validation_loss
statistical_view_scope: compact_target_free_v2
deterministic: true
device_policy: cpu
smoke_test_steps: 3
seeds:
  - 11
  - 22
  - 33
  - 44
  - 55

collapse_thresholds:
  variance_min: 0.000001
  unique_min_fraction: 0.25
  mean_pairwise_cosine_max: 0.98
  pairwise_cosine_std_min: 0.0001
  norm_tolerance: 0.0001

external_validation_policy:
  lendingclub_v2_training_allowed: false
  lendingclub_v2_model_selection_allowed: false
  lendingclub_v2_anchor_allowed: false
  downstream_lr_catboost_allowed: false
