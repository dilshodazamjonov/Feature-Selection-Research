schema_version: ram_wait_resume_policy_v1
profile_name: prompt_16_user_approved_ram_wait_resume_v1

# Operational-only amendment approved by the user after the bounded pilot
# demonstrated that suspending a 21.9 GiB selector at the former 8 GiB floor
# retained too much memory to reach the former 10 GiB recovery threshold.
# Scientific settings, the 24 GiB owned-process ceiling, and disk/wall-clock
# limits are unchanged.
emergency_min_available_ram_gb: 1
emergency_total_ram_fraction: 0.02
recovery_available_ram_gb: 2
recovery_consecutive_checks: 3
check_interval_seconds: 5
log_interval_seconds: 300
opaque_stage_pause_mode: process_tree_suspend
