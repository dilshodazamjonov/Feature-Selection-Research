schema_version: resource_safe_execution_policy_v1
profile_name: prompt_16_final_amended_oot_v1

parallelism:
  concurrent_experiment_runs: 1
  concurrent_folds: 1
  data_loader_workers: 0
  estimator_threads: 4
  allow_nested_parallelism: false

memory:
  reserve_system_ram_gb: 4
  warn_process_tree_rss_gb: 28
  abort_process_tree_rss_gb: 32
  abort_if_system_available_below_gb: 2
  estimated_peak_safety_factor: 1.15

gpu:
  reserve_vram_gb: 1.5
  warn_process_vram_gb: 5.5
  abort_process_vram_gb: 6.5
  require_gpu_telemetry_for_gpu_runs: true

disk:
  minimum_free_results_gb: 80
  minimum_free_temp_gb: 20
  estimated_write_safety_factor: 2.5

monitoring:
  sample_interval_seconds: 1.0
  graceful_stop_timeout_seconds: 20
  forced_stop_timeout_seconds: 10
