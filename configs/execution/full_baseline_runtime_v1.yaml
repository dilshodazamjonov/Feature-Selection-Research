dataset_components:
  homecredit:
    cost_class: light
    wall_clock_limit_seconds: 10800
  lendingclub_v2:
    cost_class: light
    wall_clock_limit_seconds: 10800

final_model_components:
  lr:
    cost_class: light
    wall_clock_limit_seconds: 10800
