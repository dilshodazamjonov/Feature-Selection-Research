dataset_name: homecredit
model_selector: lr
results_dir: results
random_seed: 42
feature_budgets:
  lr: 20
  catboost: 40
n_splits: 5
dev_start_day: -600
oot_start_day: -240
oot_end_day: 0
cv_gap_groups: 1

llm:
  enabled: true
  shared_ranking_enabled: true
  ranking_budget:
    lr_candidate_pool: 60
    catboost_candidate_pool: 100
    max_shared_pool: 100
  prompt_version: stability_expert_v3
  model: gpt-4.1-mini
  max_features: 100
  cache_dir: artifacts/llm_cache

model_params:
  lr:
    solver: liblinear
    max_iter: 1000
    class_weight: balanced
    random_state: 42
  rf:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 5
    max_features: sqrt
    class_weight: balanced
    random_state: 42
    n_jobs: -1
  catboost:
    depth: 10
    learning_rate: 0.01
    l2_leaf_reg: 95
    min_data_in_leaf: 290
    colsample_bylevel: 0.9
    random_strength: 0.125
    grow_policy: Depthwise
    one_hot_max_size: 21
    leaf_estimation_method: Newton
    bootstrap_type: Bernoulli
    subsample: 0.55
    loss_function: Logloss
    eval_metric: AUC
    auto_class_weights: Balanced
    iterations: 1500
    early_stopping_rounds: 150
    verbose: 100
    random_state: 42
    allow_writing_files: false
