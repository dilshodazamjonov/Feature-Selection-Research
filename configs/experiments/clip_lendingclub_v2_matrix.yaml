dataset_name: lendingclub_v2
results_dir: results/clip/lendingclub_v2_matrix
clip_selector:
  enabled: true
  config_path: configs/clip/selector.yaml
  selectors:
    - clip
    - clip_then_mrmr
  models:
    - lr
    - catboost
  feature_budgets:
    lr: 20
    catboost: 40
  screening_pool_size: 100
  no_refit: true
  anchor_policy: uses unchanged Home Credit learned anchor
  note: external-validation selector config; do not run without explicit matrix approval.
