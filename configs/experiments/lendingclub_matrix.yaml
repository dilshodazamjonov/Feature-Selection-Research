dataset_name: lendingclub
model_selector: lr
data_dir: data/lendingclub/processed
description_path: data/lendingclub/metadata/columns_description.csv
results_dir: results
random_seed: 42
feature_budgets:
  lr: 20
  catboost: 40
n_splits: 5
dev_start_day: -1795
oot_start_day: -1065
oot_end_day: -730
