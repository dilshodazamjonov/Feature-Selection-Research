description_path: data/homecredit/metadata/columns_description.csv
results_dir: results
random_seed: 42
feature_budgets:
  lr: 20
  catboost: 40
n_splits: 5
dev_start_day: -600
oot_start_day: -240
oot_end_day: 0
cv_gap_groups: 1
stable_row_id_column: SK_ID_CURR
excluded_feature_columns:
  - TARGET
  - recent_decision
  - PREV_recent_decision_MAX
  - DAYS_DECISION
  - application_time_proxy
