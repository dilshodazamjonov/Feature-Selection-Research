forward_voting:
  protocol: configs/protocols/cross_dataset_rank_voting_v1.yaml
  name: cross_dataset_rank_voting_v1
  version: 1.0.0
  historical_replication: false
  datasets: [homecredit, lendingclub_v2]
  included_voters: [rf_corr_mrmr, boruta]
  excluded_voters: [corrected_clip, api_backed_llm, domain_rule, rfe]
  voter_fit_boundary: dev_fold_training_only
  normalized_score: 1 - (rank - 1) / max(N - 1, 1)
  missing_rank_score: 0
  weights: equal
  ties: [voter_presence_count_desc, best_individual_rank_asc, normalized_feature_name_asc]
  pools: [100, 200, 300]
  primary_pool: 200
  downstream_selector: credit_risk_fs.selectors.rfe.RFESelector
  final_budgets: {lr: 20, catboost: 40}
  seed: 42
  status: verified_and_frozen

models:
  lr:
    implementation: credit_risk_fs.models.logistic_regression.LogisticRegressionModel
    parameters: {solver: liblinear, max_iter: 1000, class_weight: balanced, random_state: 42}
    feature_budget: 20
    status: verified
  catboost:
    implementation: credit_risk_fs.models.catboost_model.CatBoostModel
    parameters:
      depth: 10
      learning_rate: 0.01
      l2_leaf_reg: 95
      min_data_in_leaf: 290
      colsample_bylevel: 0.9
      random_strength: 0.125
      grow_policy: Depthwise
      one_hot_max_size: 21
      leaf_estimation_method: Newton
      bootstrap_type: Bernoulli
      subsample: 0.55
      loss_function: Logloss
      eval_metric: AUC
      auto_class_weights: Balanced
      iterations: 1500
      early_stopping_rounds: 150
      random_state: 42
      allow_writing_files: false
    feature_budget: 40
    status: verified

evaluation:
  positive_probability: class_1
  roc_auc:
    function: sklearn.metrics.roc_auc_score via credit_risk_fs.evaluation.metrics.calculate_metrics
    tie_rule: sklearn_rank_tie_handling
    status: verified
  gini:
    formula: 2 * ROC_AUC - 1
    status: verified
  ks:
    function: credit_risk_fs.evaluation.paired_inference.ks_statistic
    definition: maximum absolute positive/negative empirical-CDF separation
    tie_rule: smallest score among equal maxima
    status: verified
  operational_threshold:
    rule: maximize KS on the fitting/training partition and apply the resulting threshold unchanged to held-out validation or OOT
    oot_used_to_choose_threshold: false
    status: verified
  lift_at_10:
    rule: sort class-1 probability descending; top count is ceil(0.10*n); lift is top positive rate divided by overall positive rate
    tie_rule: authenticated stable row ID ascending
    function: credit_risk_fs.evaluation.paired_inference.lift_at_fraction
    edge_cases: reject empty data, duplicate identities, or zero positive rate
    status: verified
  feature_psi:
    function: credit_risk_fs.evaluation.drift.calculate_psi
    expected_distribution: DEV_or_fold_training
    actual_distribution: heldout_or_OOT_unchanged
    bins: 10_expected_quantile_bins_with_unique_edges_and_infinite_outer_edges
    epsilon: 0.000001
    edge_cases: nonfinite values dropped; NaN for empty or constant expected distribution
    status: verified
  score_psi:
    historical_scalar: same general PSI implementation saved by the original matrix runs
    forward_function: credit_risk_fs.pipelines.common strict DEV_OOF quantile PSI v1
    bins: 10
    epsilon: 0.000001
    fit_choice: DEV_OOF defines bins; OOT applied unchanged
    historical_forward_identity_match: false
    status: evidence_backed_inference
  fold_selection_jaccard:
    historical_fold_metric: consecutive_fold_jaccard
    forward_summary: mean over all unordered fold pairs
    function: credit_risk_fs.evaluation.stability
    empty_set_rule: 1.0 when both sets are empty
    status: verified
  kuncheva:
    function: credit_risk_fs.evaluation.stability
    formula: mean((r*n-k_i*k_j)/(n*min(k_i,k_j)-k_i*k_j)) over fold pairs
    zero_denominator_pairs: skipped
    status: verified
  confidence_intervals:
    historical: fold mean plus_or_minus 1.96 * sample_standard_deviation / sqrt(fold_count)
    canonical_forward: paired stratified bootstrap differences with 95 percent percentile interval
    status: verified
  paired_delong:
    function: credit_risk_fs.evaluation.paired_inference.paired_delong_test
    alternative: two_sided
    identity_boundary: identical OOT stable row IDs and targets
    family: three voting pools versus rf_corr_mrmr within one dataset-model pair
    status: verified
  paired_stratified_bootstrap:
    function: credit_risk_fs.evaluation.paired_inference.paired_stratified_bootstrap
    seed: 20260721
    repetitions: 2000
    minimum_valid_repetitions: 1900
    confidence_level: 0.95
    interval: percentile
    metrics: [auc, ks, lift_at_10]
    failure_policy: count and report; no unlimited replacements
    status: verified
  multiple_testing:
    families:
      - homecredit_lr
      - homecredit_catboost
      - lendingclub_v2_lr
      - lendingclub_v2_catboost
    comparisons_per_family: [voting_pool_100_vs_rf_corr_mrmr, voting_pool_200_vs_rf_corr_mrmr, voting_pool_300_vs_rf_corr_mrmr]
    pooling_across_families: false
    status: verified
  holm_correction:
    function: credit_risk_fs.evaluation.paired_inference.holm_adjust
    scope: separately within each three-comparison dataset-model family
    status: verified

seeds:
  experiment: 42
  mrmr: 42
  boruta: 42
  rfe_catboost: 42
  clip_training_historical_config: [11, 22, 33, 44, 55]

prediction_schema:
  required_columns: [stable_row_id, target, prediction_probability, predicted_class, fold_id, dataset, split, run_id, method, model, source_training_dataset, external_dataset, data_manifest_hash, configuration_hash, pairing_policy_version, source_identity_manifest_hash, stable_row_id_column, source_stable_id_values_hash]
  probability: finite_class_1_probability_in_closed_interval_0_1
  order: stable_row_id ascending using stable mergesort
  dev_oof_fold_id: required
  oot_fold_id: null
  authenticated_source_identity:
    homecredit: verified
    lendingclub_v2: verified_original_loan_id_sidecar
  implementation: credit_risk_fs.pipelines.common.export_prediction_artifact
  status: verified

prompt_2_prerequisites:
  - preserve the frozen protocol and OOT lock while implementing Prompt 2 resource hardening
  - require the generated LendingClub identity sidecar and manifest before any LendingClub run
  - do not restore corrected CLIP without a separately versioned protocol and complete provenance
  - historical CLIP tests remain optional integrations requiring clip_complete_v1
