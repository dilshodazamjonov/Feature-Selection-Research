    preprocessing_boundaries:
      cv: fit selector and preprocessor on each fold training partition; transform validation unchanged
      final: fit on DEV only; transform OOT unchanged
      evidence: src/credit_risk_fs/models/_fold.py
      status: verified
    feature_budgets: {lr: 20, catboost: 40, status: verified}
    seed: 42
    row_alignment_reference: configs/protocols/row_alignment_contract_v1.json

candidate_pools:
  lendingclub_v2_voting:
    valid_candidate_count: 675
    pools: [100, 200, 300]
    decision_basis: Prompt 1 rule retains 100/200/300 when at least 300 valid candidates exist
    uses_oot_outcomes: false
    approval_status: verified
    protocol: cross_dataset_rank_voting_v1
    historical_replication: false
    status: frozen_prospectively

selectors:
  rf_corr_mrmr:
    executable: credit_risk_fs.selectors.mrmr.RandomForestRelevanceMRMRSelector
    registry_key: mrmr
    historical_labels: [mrmr, MRMR]
    relevance: mean random-forest impurity importance over n_iter fits; default RF has 128 trees, min_samples_split 0.01, max_features 0.15
    redundancy: mean absolute Pearson correlation against already selected features on a deterministic sample of at most 10000 rows, floored at 0.05
    greedy_score: relevance / redundancy; first feature has highest relevance
    seed: 42
    tie_rule: descending score then ascending feature name with stable mergesort
    canonical_mutual_information_mrmr: future_work_not_implemented
    status: verified
  boruta:
    executable: credit_risk_fs.selectors.boruta.BorutaSelector
    registry_behavior: boruta_only
    rf_estimators: 500
    rf_max_depth: 6
    boruta_estimators: auto
    max_iter: 15
    seed: 42
    output_contract: selected_features_ with selected_features compatibility alias
    status: verified
  boruta_rfe:
    executable: credit_risk_fs.selectors.boruta_then_rfe.BorutaThenRFESelector
    registry_behavior: sequential_boruta_then_rfe
    rfe_executable: credit_risk_fs.selectors.rfe.RFESelector
    output_contract: selected_features_ with selected_features compatibility alias
    status: verified
  rfe:
    executable: credit_risk_fs.selectors.rfe.RFESelector
    estimator: CatBoost iterations=500 depth=6 learning_rate=0.05 random_seed=42 allow_writing_files=false
    status: verified
  llm:
    executable: credit_risk_fs.selectors.llm_screening.LLMSelector
    historical_kind: cached_external_api_ranking
    model_request: gpt-4.1-mini
    model_response: gpt-4.1-mini-2025-04-14
    prompt_version: stability_expert_v3
    rank_orientation: 1_is_best
    raw_api_metadata_available: true
    raw_model_text_availability: cached response payload available
    regeneration_allowed: false
    status: verified
  domain_rule_baseline:
    executable: credit_risk_fs.selectors.domain_rule_baseline.DomainRuleBaselineSelector
    generator: scripts/generate_homecredit_domain_rule_ranking.py
    kind: deterministic_domain_rule_not_llm
    rank_orientation: 1_is_best
    status: verified
  corrected_clip:
    kind: corrected_clip_ranking
    artifact: null
    cross_dataset_rank_voting_v1_eligibility: excluded
    reason: complete corrected-CLIP provenance is absent
    status: unavailable_historical_evidence_nonblocking

