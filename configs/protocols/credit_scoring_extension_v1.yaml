    identifier_policy:
      missing: reject
      duplicate: reject
      dev_oot_overlap: reject
    target:
      column: TARGET
      positive_class: 1
      meaning: client has payment difficulties under the Home Credit definition
      evidence: data/homecredit/metadata/columns_description.csv
    split:
      time_column: recent_decision
      derivation: maximum DAYS_DECISION per SK_ID_CURR from previous_application.csv
      broader_application_time_proxy_role: excluded_feature_not_the_configured_split_column
      dev: {lower_inclusive: -600, upper_exclusive: -240, rows: 99092, positives: 7859, positive_rate: 0.07931013603519961}
      oot: {lower_inclusive: -240, upper_inclusive: 0, rows: 120053, positives: 10688, positive_rate: 0.08902734625540386}
      fold_rule:
        implementation: credit_risk_fs.models._cv_utils.GroupedTimeSeriesSplit
        n_splits: 5
        gap_unique_time_groups: 1
        training_window: expanding
        identical_time_values_kept_together: true
      source_order_rule: application_train.csv source order after the left ID/time merge
      training_sort_rule:
        implementation: credit_risk_fs.models.training.run_temporal_cv
        current_rule: pandas sort_values on recent_decision only
        tie_rule: not_explicitly_stable
        status: unresolved
    candidate_universe:
      count: 529
      stage: post-feature-engineering and configured exclusion, before selector
      exclusions: [TARGET, recent_decision, PREV_recent_decision_MAX, DAYS_DECISION, application_time_proxy, SK_ID_CURR, SK_ID_BUREAU, SK_ID_PREV]
