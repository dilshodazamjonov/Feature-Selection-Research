protocol:
  name: credit_scoring_extension
  version: 1.1.0
  frozen_on: '2026-07-21'
  gate: PASS
  evidence_precedence:
    - saved_run_specific_manifest_or_configuration
    - saved_prediction_or_split_metadata
    - executable_configuration_used_by_run
    - repository_default
    - documentation
    - evidence_backed_inference
  prohibited_for_this_freeze:
    - model_fitting
    - feature_selection_execution
    - prediction_generation
    - voting_execution
    - shap_clip_embedding_umap_execution
    - external_llm_api_calls
    - oot_based_configuration_choice

result_roots:
  active:
    path: D:/python projects/Research/results
    write_policy: central_active_results_system_only
    status: verified
  historical:
    configuration: CREDIT_RISK_LEGACY_RESULTS_ROOT
    audited_path: D:/ResearchFindings/results
    write_policy: immutable_read_only_evidence
    manifest: cleanup/audits/foundation_protocol_freeze/legacy_artifact_manifest.csv
    status: verified
  separation:
    rule: canonical roots must be different, non-overlapping, and outside data and temporary-test roots
    implementation: credit_risk_fs.experiments.result_paths.validate_results_root_separation
    write_barrier: credit_risk_fs.experiments.result_paths.reject_historical_write
    status: verified

datasets:
